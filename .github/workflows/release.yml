name: Release

# Tag qo'yilganda Windows uchun o'rnatuvchi quriladi, updater artefaktlari
# imzolanadi va relizga latest.json qo'shiladi.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # snip.rs to'liq Win32 API'ga tayanadi — birinchi reliz Windows-only.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GameTranslator ${{ github.ref_name }}
          releaseBody: |
            Windows 10/11. O'rnatgandan keyin o'zingizning Google Gemini kalitingizni kiritasiz.

            Windows 10/11. After installing, enter your own Google Gemini API key.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target x86_64-pc-windows-msvc
